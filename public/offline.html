<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LifeOS — Offline</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #F8FAFC;
    color: #0F172A;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #0F172A; color: #F1F5F9; }
    .card { background: #1E293B !important; border-color: #334155 !important; }
    .muted { color: #94A3B8 !important; }
  }
  .card {
    max-width: 420px;
    text-align: center;
    background: #FFFFFF;
    border: 1px solid #E2E8F0;
    border-radius: 12px;
    padding: 32px 24px;
  }
  h1 { font-size: 1.25rem; margin: 0 0 8px; }
  p { margin: 0; font-size: 0.9rem; line-height: 1.5; }
  .muted { color: #64748B; }
  button {
    margin-top: 20px;
    min-height: 44px;
    padding: 0 20px;
    border: none;
    border-radius: 6px;
    background: #0F9EA0;
    color: #FFFFFF;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>You're offline</h1>
    <p class="muted">
      LifeOS can't reach the server right now. Notes, Tasks, your Dua routine,
      and Finance quick entries you already had open keep working and will
      sync automatically once you're back online.
    </p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
